# Talks: `title` is single-language (talk titles/paper titles are not translated).
# `venue` is per-language because Basque grammar bakes a case suffix into the
# venue name and Spanish phrasing inserts words like "la conferencia" — a
# single fixed sentence joiner can't reproduce that mechanically, so the
# already-correctly-declined venue text is stored once per language instead.
# The surrounding sentence ("Talk on {title} at {venue}.") lives in
# _data/i18n.yml as `talk_sentence`, one template per language.
- id: erf2025-virtual-to-reality
  year: 2025
  title: "Virtual to Reality: Simulation-Driven Perception and Grasping for Robots"
